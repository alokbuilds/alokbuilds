{% extends 'base.html' %}

{% block title %}
Login | AlokBuilds
{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <h1>

            Welcome Back 👋

        </h1>

        <p>

            Login to access your account.

        </p>

        <form method="post">

            {% csrf_token %}

            <div class="form-group">

                <label>

                    Username

                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required>

            </div>

            <div class="form-group">

                <label>

                    Password

                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required>

            </div>

            <button
                type="submit"
                class="btn">

                Login

            </button>

        </form>

        <p class="auth-link">

            Don't have an account?

            <a href="{% url 'accounts:register' %}">

                Register

            </a>

        </p>

    </div>

</section>

{% endblock %}
