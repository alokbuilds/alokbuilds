{% extends 'base.html' %}

{% block title %}
Register | AlokBuilds
{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <h1>

            Create Account 🚀

        </h1>

        <p>

            Join AlokBuilds today.

        </p>

        <form method="post">

            {% csrf_token %}

            <div class="form-group">

                <label>

                    Username

                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Choose username"
                    required>

            </div>

            <div class="form-group">

                <label>

                    Email

                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter email"
                    required>

            </div>

            <div class="form-group">

                <label>

                    Password

                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create password"
                    required>

            </div>

            <button
                type="submit"
                class="btn">

                Register

            </button>

        </form>

        <p class="auth-link">

            Already have an account?

            <a href="{% url 'accounts:login' %}">

                Login

            </a>

        </p>

    </div>

</section>

{% endblock %}
