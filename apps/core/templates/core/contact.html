{% extends 'base.html' %}

{% block content %}

<section class="page-banner">

    <h1>
        Contact Us
    </h1>

    <p>
        Feel free to contact for projects, collaborations and resources.
    </p>

</section>


<section class="contact-section">

    <form class="contact-form">

        <input
            type="text"
            placeholder="Your Name">

        <input
            type="email"
            placeholder="Your Email">

        <textarea
            rows="6"
            placeholder="Your Message"></textarea>

        <button type="submit">
            Send Message
        </button>

    </form>

</section>

{% endblock %}
